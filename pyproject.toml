[project]
name = "aurora-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hikari-lightbulb>=3.2.4",
    "hikari[speedups]>=2.5.0",
    "linkd>=0.6.0",
    "loguru>=0.7.3",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[project.scripts]
aurora = "aurora.__main__:main"

[tool.mypy]
strict = true

[tool.ruff]
format.preview = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

