[project]
name = "aurora-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hikari-lightbulb>=3.2.4",
    "hikari[speedups]>=2.5.0",
    "linkd>=0.6.0",
    "loguru>=0.7.3",
    "nox>=2026.4.10",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[project.scripts]
aurora = "aurora.__main__:main"

[tool.ruff]
format.preview = true
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "A",
    "C4",
    "RUF",
    "ANN",
    "PYI"
]
preview = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

